<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>Babylon Character Demo</title>
    <script src="lib/babylon.js"></script>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #131418;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }
        #hp-bar {
            position: absolute;
            left: 16px;
            top: 16px;
            font-size: 28px;
            color: #e04040;
            z-index: 20;
            pointer-events: none;
            text-shadow: 0 0 6px rgba(0,0,0,0.7);
            letter-spacing: 2px;
            user-select: none;
        }
        .stamina-bar-track {
            position: absolute;
            width: 168px;
            height: 24px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            z-index: 20;
            pointer-events: none;
            overflow: hidden;
            transform: translateX(-50%);
            user-select: none;
        }
        .stamina-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(to right, #981818, #d2a932, #1f72e7);
            background-size: 168px 100%;
            background-repeat: no-repeat;
            border-radius: 4px;
            transition: width 0.08s linear;
        }
        #hud-left {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            pointer-events: none;
        }
        #inventory-bar, #buff-bar {
            display: flex;
            flex-direction: row;
            gap: 6px;
            align-items: center;
        }
        .inventory-slot, .buff-slot {
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .inventory-slot img, .buff-slot img {
            max-width: 32px;
            max-height: 32px;
            image-rendering: pixelated;
            object-fit: contain;
        }
        .buff-icon-unicode {
            font-size: 24px;
            line-height: 1;
        }
        .dialogue-bubble {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -100%);
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid rgba(60, 60, 60, 1);
            border-radius: 8px;
            padding: 6px 12px;
            min-width: 40px;
            min-height: 24px;
            z-index: 500;
        }
        #main-menu, #menu-subview {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            user-select: none;
        }
        #main-menu.hidden, #menu-subview.hidden { display: none; }
        .menu-title {
            font-size: 64px;
            letter-spacing: 12px;
            color: #e8e2d0;
            text-shadow: 0 0 18px rgba(0, 0, 0, 0.8);
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 220px;
        }
        .menu-buttons button, #menu-subview-back {
            padding: 10px 24px;
            font-size: 20px;
            color: #e8e2d0;
            background: rgba(20, 22, 30, 0.85);
            border: 1px solid rgba(232, 226, 208, 0.35);
            border-radius: 4px;
            cursor: pointer;
        }
        .menu-buttons button:hover:not(:disabled), #menu-subview-back:hover {
            background: rgba(60, 64, 80, 0.9);
            border-color: rgba(232, 226, 208, 0.8);
        }
        .menu-buttons button:disabled {
            opacity: 0.35;
            cursor: default;
        }
        #menu-subview-title {
            font-size: 36px;
            color: #e8e2d0;
            letter-spacing: 6px;
        }
        #menu-subview-content {
            max-width: 720px;
            max-height: 55vh;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.7;
            color: #c9c4b4;
            text-align: center;
        }
        .menu-subview-line { white-space: pre-wrap; }
        #menu-subview-back { margin-top: 8px; }
        #ending-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            z-index: 1000;
            background: #000;
            user-select: none;
        }
        #ending-overlay.hidden { display: none; }
        #ending-overlay .ending-text {
            font-size: 44px;
            letter-spacing: 8px;
            color: #e8e2d0;
        }
        #ending-overlay .ending-hint {
            font-size: 16px;
            letter-spacing: 4px;
            color: #8a8676;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="hp-bar"></div>
    <div id="hud-left">
        <div id="inventory-bar"></div>
        <div id="buff-bar"></div>
    </div>
    <div id="dialogue-bubble-container"></div>
    <div id="main-menu" class="hidden">
        <div class="menu-title">BLIND DUEL</div>
        <div class="menu-buttons">
            <button id="menu-btn-new-game">New Game</button>
            <button id="menu-btn-continue">Continue</button>
            <button id="menu-btn-how-to-play">How to Play</button>
            <button id="menu-btn-credits">Credits</button>
        </div>
    </div>
    <div id="menu-subview" class="hidden">
        <div id="menu-subview-title"></div>
        <div id="menu-subview-content"></div>
        <button id="menu-subview-back">Back</button>
    </div>
    <script type="module" src="./character_demo.js?v=20260604"></script>
</body>
</html>
